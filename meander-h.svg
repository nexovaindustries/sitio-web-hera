<svg xmlns="http://www.w3.org/2000/svg" width="100" height="50" viewBox="0 0 100 50">
  <rect width="100" height="50" fill="#FDFBF7"/>
  <!-- Key Unit 1 (0-50) -->
  <!-- Outer shape - lighter blue fill -->
  <path d="M0,0 H50 V50 H10 V10 H40 V40 H20 V20 H30 V30 H20" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1.5"/>
  <!-- Fill correction: use filled rects for clean geometry -->
  <!-- Clear and redraw with precise rects -->
  <rect x="0" y="0" width="100" height="50" fill="#FDFBF7"/>

  <!-- KEY 1: Greek key spiral (clockwise, 0-50 x) -->
  <!-- Top bar -->
  <rect x="0" y="0" width="50" height="7" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Right bar -->
  <rect x="43" y="0" width="7" height="50" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Bottom bar (partial - from right, leaving left open) -->
  <rect x="14" y="43" width="36" height="7" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Left bar (partial - from top, not reaching bottom) -->
  <rect x="0" y="0" width="7" height="29" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Inner top bar -->
  <rect x="14" y="14" width="22" height="7" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Inner right bar -->
  <rect x="29" y="14" width="7" height="22" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Inner bottom-left connector -->
  <rect x="14" y="29" width="7" height="14" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>

  <!-- KEY 2: Mirrored Greek key (counter-clockwise, 50-100 x) -->
  <!-- Top bar -->
  <rect x="50" y="0" width="50" height="7" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Left bar -->
  <rect x="50" y="0" width="7" height="50" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Bottom bar (partial - from left, leaving right open) -->
  <rect x="50" y="43" width="36" height="7" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Right bar (partial - from top, not reaching bottom) -->
  <rect x="93" y="0" width="7" height="29" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Inner top bar -->
  <rect x="64" y="14" width="22" height="7" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Inner left bar -->
  <rect x="64" y="14" width="7" height="22" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
  <!-- Inner bottom-right connector -->
  <rect x="79" y="29" width="7" height="14" fill="#5B8EC2" stroke="#1B3A6B" stroke-width="1"/>
</svg>
